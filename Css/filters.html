<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css filters</title>
    <style>
        img{
            filter: blur(60px);
            filter: brightness(0.6);
            filter: contrast(60%);
            filter: invert(0.8);
            filter: saturate(30%);
            filter: opacity(25%);
            filter: sepia(60%);
            filter: drop-shadow(16px 16px 20px red) invert(75%);
        }
    </style>
</head>
<body>
    <img src="forza-horizon-6-3840x2160-25224.jpg" alt="">
</body>
</html>
